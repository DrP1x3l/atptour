# docker-compose per ATP Tour v2
#
# Si aggancia ai container di infrastruttura del Lonaserver (server-postgres,
# server-redis) tramite una rete esterna già esistente.
#
# IMPORTANTE: il nome della rete esterna ("lonaserver") va sostituito con quello
# REALE in cui girano server-postgres/server-redis. Per scoprirlo:
#   docker network ls
#   docker inspect server-postgres | grep -A1 Networks
#
# In dev locale, basta cambiare la rete da "external: true" a "driver: bridge"
# e aggiungere un servizio postgres locale (commentato sotto).

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: atptour-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${API_PORT:-3012}
      DATABASE_URL: ${DATABASE_URL}
      APP_SECRET: ${APP_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      REDIS_URL: ${REDIS_URL:-}
    ports:
      - "127.0.0.1:${API_PORT:-3012}:3012"
    networks:
      - lonaserver
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3012/healthz"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_APP_SECRET: ${VITE_APP_SECRET}
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    container_name: atptour-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3011}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lonaserver
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 5

  # ---- Servizi locali di sviluppo (decommenta solo in dev) ----
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: atptour-pg-dev
  #   environment:
  #     POSTGRES_DB: atptour
  #     POSTGRES_USER: atptour
  #     POSTGRES_PASSWORD: dev
  #   ports:
  #     - "127.0.0.1:5433:5432"
  #   volumes:
  #     - atptour_pg_dev:/var/lib/postgresql/data
  #   networks:
  #     - lonaserver

networks:
  lonaserver:
    # In prod: rete dove vivono server-postgres e server-redis.
    # Cambia il nome dopo `docker network ls`.
    external: true
    name: lonaserver

