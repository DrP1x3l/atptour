# docker-compose per ATP Tour v2 - monolite (un solo container, un solo processo Node).
#
# Si aggancia ai container di infrastruttura del Lonaserver (server-postgres,
# server-redis) tramite la rete esterna esistente "server_default".
#
# In dev locale, decommenta il servizio postgres e cambia networks.lonaserver
# da `external: true` a `driver: bridge`.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        VITE_APP_SECRET: ${VITE_APP_SECRET}
    container_name: atptour
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      APP_SECRET: ${APP_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      REDIS_URL: ${REDIS_URL:-}
      PUBLIC_DIR: /app/public
    ports:
      # Unica porta esposta: solo localhost. Il Cloudflare Tunnel deve puntare
      # a questa porta host (oppure direttamente a "atptour:3000" via rete).
      - "127.0.0.1:${HOST_PORT:-3018}:3000"
    networks:
      - lonaserver
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/healthz',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---- Postgres di sviluppo locale (decommenta SOLO in dev) ----
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: atptour-pg-dev
  #   environment:
  #     POSTGRES_DB: atptour
  #     POSTGRES_USER: atptour
  #     POSTGRES_PASSWORD: dev
  #   ports:
  #     - "127.0.0.1:5433:5432"
  #   volumes:
  #     - atptour_pg_dev:/var/lib/postgresql/data
  #   networks:
  #     - lonaserver

networks:
  lonaserver:
    # Rete OrbStack del Lonaserver dove vivono server-postgres e server-redis.
    # In dev locale: rimuovi "external: true / name:" e metti "driver: bridge".
    external: true
    name: server_default

